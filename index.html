<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D House Explorer - AR Camera</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: #000;
        }
        
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #videoFeed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        
        #canvas3D {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }
        
        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            display: flex;
            gap: 15px;
        }
        
        .control-btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid #fff;
            border-radius: 50%;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        
        .control-btn:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.95);
        }
        
        #startBtn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            z-index: 10;
        }
        
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 5px;
            z-index: 3;
            font-size: 14px;
        }
        
        #scanProgress {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 5px;
            z-index: 3;
        }
    </style>
</head>
<body>
    <div id="container">
        <video id="videoFeed" autoplay playsinline></video>
        <canvas id="canvas3D"></canvas>
        
        <div id="info">🏠 3D House Explorer</div>
        <div id="scanProgress">Scan: 0%</div>
        
        <button id="startBtn">📷 Start Camera & Scan</button>
        
        <div id="controls">
            <button class="control-btn" id="leftBtn">←</button>
            <button class="control-btn" id="forwardBtn">↑</button>
            <button class="control-btn" id="rightBtn">→</button>
            <button class="control-btn" id="backBtn">↓</button>
            <button class="control-btn" id="jumpBtn">⬆</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Global variables
        let scene, camera, renderer, character;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let canJump = false, velocityY = 0;
        let scanProgress = 0;
        let roomObjects = [];

        // Initialize Three.js
        function init() {
            // Scene
            scene = new THREE.Scene();
            
            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 5);
            
            // Renderer
            const canvas = document.getElementById('canvas3D');
            renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 5);
            scene.add(directionalLight);
            
            // Create Character (Free Fire style boy)
            createCharacter();
            
            // Create Room
            createRoom();
            
            // Event Listeners
            setupControls();
            
            // Start animation
            animate();
        }

        // Create Character
        function createCharacter() {
            character = new THREE.Group();
            
            // Body
            const bodyGeometry = new THREE.CylinderGeometry(0.3, 0.3, 1, 8);
            const bodyMaterial = new THREE.MeshPhongMaterial({ color: 0x2196F3 });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 0.5;
            character.add(body);
            
            // Head
            const headGeometry = new THREE.SphereGeometry(0.3, 16, 16);
            const headMaterial = new THREE.MeshPhongMaterial({ color: 0xFFDBB5 });
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.position.y = 1.3;
            character.add(head);
            
            // Arms
            const armGeometry = new THREE.CylinderGeometry(0.1, 0.1, 0.8, 8);
            const armMaterial = new THREE.MeshPhongMaterial({ color: 0x2196F3 });
            
            const leftArm = new THREE.Mesh(armGeometry, armMaterial);
            leftArm.position.set(-0.4, 0.5, 0);
            leftArm.rotation.z = 0.3;
            character.add(leftArm);
            
            const rightArm = new THREE.Mesh(armGeometry, armMaterial);
            rightArm.position.set(0.4, 0.5, 0);
            rightArm.rotation.z = -0.3;
            character.add(rightArm);
            
            // Legs
            const legGeometry = new THREE.CylinderGeometry(0.12, 0.12, 0.8, 8);
            const legMaterial = new THREE.MeshPhongMaterial({ color: 0x424242 });
            
            const leftLeg = new THREE.Mesh(legGeometry, legMaterial);
            leftLeg.position.set(-0.15, -0.4, 0);
            character.add(leftLeg);
            
            const rightLeg = new THREE.Mesh(legGeometry, legMaterial);
            rightLeg.position.set(0.15, -0.4, 0);
            character.add(rightLeg);
            
            character.position.set(0, 0, 0);
            scene.add(character);
        }

        // Create Room
        function createRoom() {
            // Floor
            const floorGeometry = new THREE.PlaneGeometry(20, 20);
            const floorMaterial = new THREE.MeshPhongMaterial({ 
                color: 0x8B4513,
                side: THREE.DoubleSide 
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);
            
            // Walls
            const wallMaterial = new THREE.MeshPhongMaterial({ 
                color: 0xF5F5DC,
                transparent: true,
                opacity: 0.3
            });
            
            // Back wall
            const backWall = new THREE.Mesh(
                new THREE.PlaneGeometry(20, 5),
                wallMaterial
            );
            backWall.position.set(0, 2.5, -10);
            scene.add(backWall);
            
            // Left wall
            const leftWall = new THREE.Mesh(
                new THREE.PlaneGeometry(20, 5),
                wallMaterial
            );
            leftWall.position.set(-10, 2.5, 0);
            leftWall.rotation.y = Math.PI / 2;
            scene.add(leftWall);
            
            // Right wall
            const rightWall = new THREE.Mesh(
                new THREE.PlaneGeometry(20, 5),
                wallMaterial
            );
            rightWall.position.set(10, 2.5, 0);
            rightWall.rotation.y = -Math.PI / 2;
            scene.add(rightWall);
            
            // Furniture
            addFurniture();
        }

        // Add Furniture
        function addFurniture() {
            // Table
            const tableGeometry = new THREE.BoxGeometry(2, 0.1, 1);
            const tableMaterial = new THREE.MeshPhongMaterial({ color: 0x8B4513 });
            const table = new THREE.Mesh(tableGeometry, tableMaterial);
            table.position.set(0, 0.8, -5);
            scene.add(table);
            
            // Table legs
            for (let i = 0; i < 4; i++) {
                const leg = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.05, 0.05, 0.8),
                    tableMaterial
                );
                leg.position.set(
                    (i % 2 === 0 ? -0.9 : 0.9),
                    0.4,
                    (i < 2 ? -5.4 : -4.6)
                );
                scene.add(leg);
            }
            
            // Chair
            const chairGeometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const chairMaterial = new THREE.MeshPhongMaterial({ color: 0x654321 });
            const chair = new THREE.Mesh(chairGeometry, chairMaterial);
            chair.position.set(0, 0.5, -3.5);
            scene.add(chair);
            
            // Sofa
            const sofaGeometry = new THREE.BoxGeometry(3, 1, 1);
            const sofaMaterial = new THREE.MeshPhongMaterial({ color: 0x4A4A4A });
            const sofa = new THREE.Mesh(sofaGeometry, sofaMaterial);
            sofa.position.set(-5, 0.5, 0);
            scene.add(sofa);
        }

        // Setup Controls
        function setupControls() {
            // Keyboard controls
            document.addEventListener('keydown', (event) => {
                switch(event.key) {
                    case 'ArrowUp':
                    case 'w':
                    case 'W':
                        moveForward = true;
                        break;
                    case 'ArrowDown':
                    case 's':
                    case 'S':
                        moveBackward = true;
                        break;
                    case 'ArrowLeft':
                    case 'a':
                    case 'A':
                        moveLeft = true;
                        break;
                    case 'ArrowRight':
                    case 'd':
                    case 'D':
                        moveRight = true;
                        break;
                    case ' ':
                        if (canJump) {
                            velocityY = 0.15;
                            canJump = false;
                        }
                        break;
                }
            });
            
            document.addEventListener('keyup', (event) => {
                switch(event.key) {
                    case 'ArrowUp':
                    case 'w':
                    case 'W':
                        moveForward = false;
                        break;
                    case 'ArrowDown':
                    case 's':
                    case 'S':
                        moveBackward = false;
                        break;
                    case 'ArrowLeft':
                    case 'a':
                    case 'A':
                        moveLeft = false;
                        break;
                    case 'ArrowRight':
                    case 'd':
                    case 'D':
                        moveRight = false;
                        break;
                }
            });
            
            // Touch controls
            document.getElementById('forwardBtn').addEventListener('touchstart', () => moveForward = true);
            document.getElementById('forwardBtn').addEventListener('touchend', () => moveForward = false);
            document.getElementById('backBtn').addEventListener('touchstart', () => moveBackward = true);
            document.getElementById('backBtn').addEventListener('touchend', () => moveBackward = false);
            document.getElementById('leftBtn').addEventListener('touchstart', () => moveLeft = true);
            document.getElementById('leftBtn').addEventListener('touchend', () => moveLeft = false);
            document.getElementById('rightBtn').addEventListener('touchstart', () => moveRight = true);
            document.getElementById('rightBtn').addEventListener('touchend', () => moveRight = false);
            document.getElementById('jumpBtn').addEventListener('touchstart', () => {
                if (canJump) {
                    velocityY = 0.15;
                    canJump = false;
                }
            });
            
            // Mouse controls for desktop
            document.getElementById('forwardBtn').addEventListener('mousedown', () => moveForward = true);
            document.getElementById('forwardBtn').addEventListener('mouseup', () => moveForward = false);
            document.getElementById('backBtn').addEventListener('mousedown', () => moveBackward = true);
            document.getElementById('backBtn').addEventListener('mouseup', () => moveBackward = false);
            document.getElementById('leftBtn').addEventListener('mousedown', () => moveLeft = true);
            document.getElementById('leftBtn').addEventListener('mouseup', () => moveLeft = false);
            document.getElementById('rightBtn').addEventListener('mousedown', () => moveRight = true);
            document.getElementById('rightBtn').addEventListener('mouseup', () => moveRight = false);
            document.getElementById('jumpBtn').addEventListener('mousedown', () => {
                if (canJump) {
                    velocityY = 0.15;
                    canJump = false;
                }
            });
        }

        // Start Camera
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                document.getElementById('videoFeed').srcObject = stream;
                document.getElementById('startBtn').style.display = 'none';
                
                // Simulate scanning
                simulateScanning();
            } catch (err) {
                console.error('Camera error:', err);
                alert('Camera access denied. Please allow camera permission.');
            }
        }

        // Simulate Room Scanning
        function simulateScanning() {
            const interval = setInterval(() => {
                scanProgress += 2;
                document.getElementById('scanProgress').textContent = `Scan: ${scanProgress}%`;
                
                if (scanProgress >= 100) {
                    clearInterval(interval);
                    document.getElementById('scanProgress').textContent = 'Scan: Complete ✓';
                }
            }, 100);
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            
            // Character movement
            const speed = 0.1;
            
            if (moveForward) {
                character.position.z -= speed;
                character.rotation.y = Math.PI;
            }
            if (moveBackward) {
                character.position.z += speed;
                character.rotation.y = 0;
            }
            if (moveLeft) {
                character.position.x -= speed;
                character.rotation.y = Math.PI / 2;
            }
            if (moveRight) {
                character.position.x += speed;
                character.rotation.y = -Math.PI / 2;
            }
            
            // Gravity
            velocityY -= 0.01;
            character.position.y += velocityY;
            
            // Ground collision
            if (character.position.y <= 0) {
                character.position.y = 0;
                velocityY = 0;
                canJump = true;
            }
            
            // Boundary check
            character.position.x = Math.max(-9, Math.min(9, character.position.x));
            character.position.z = Math.max(-9, Math.min(9, character.position.z));
            
            // Camera follow character
            camera.position.x = character.position.x;
            camera.position.z = character.position.z + 5;
            camera.position.y = character.position.y + 2;
            camera.lookAt(character.position);
            
            renderer.render(scene, camera);
        }

        // Window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start button
        document.getElementById('startBtn').addEventListener('click', () => {
            startCamera();
            init();
        });

        // Initialize on load
        window.addEventListener('load', () => {
            init();
        });
    </script>
</body>
</html>
